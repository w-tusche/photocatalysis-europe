[workspace]
name = "photocatalysis-europe"
description = "Post-processing for 'Impacts of photocatalytic hydrogen production on the European energy system'"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[tasks]
pipeline = "python run_pipeline.py"

# Figures are written as .pdf only, see figure_formats() in src/cases.py.
[activation.env]
PC_FIGURE_FORMATS = "pdf"

# Environment "default": everything except src/plot_balance_pairs.py.
# The scripts use the statistics API of PyPSA 0.29.
[dependencies]
python = "3.12.*"
pypsa = "==0.29.0"
linopy = "==0.3.14"
xarray = "2024.7.*"
netcdf4 = "1.7.*"
pandas = "2.2.*"
numpy = "1.26.*"
scipy = "1.14.*"
networkx = "3.3.*"
matplotlib = "==3.9.2"
cmcrameri = "1.9.*"
geopandas = "1.0.*"
shapely = "2.1.*"
cartopy = "0.23.*"
# map projections depend on the PROJ version
proj = "9.7.*"
pyproj = "3.7.*"
pillow = "10.4.*"
pyyaml = "6.0.*"
plotly = "6.*"
python-kaleido = ">=1.3,<2"
# src/beeswarm.py subclasses seaborn.categorical.Beeswarm of exactly this version
seaborn = "==0.13.2"

# Environment "balances": src/plot_balance_pairs.py, which needs PyPSA 1.0.
# src/supplementary_material.py starts it by itself.
[feature.balances.dependencies]
python = "3.13.*"
pypsa = "==1.0.6"
linopy = "==0.5.8"
xarray = "2025.12.*"
netcdf4 = "1.7.*"
pandas = "2.3.*"
numpy = "2.4.*"
matplotlib = "3.10.*"
geopandas = "1.1.*"
shapely = "2.1.*"
cartopy = "0.25.*"
proj = "9.7.*"
pyproj = "3.7.*"
pyyaml = "6.0.*"
packaging = "*"

[feature.balances.activation.env]
PC_FIGURE_FORMATS = "pdf"

[environments]
balances = { features = ["balances"], no-default-feature = true }
